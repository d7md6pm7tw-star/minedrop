<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mine Drop</title>
<style>
  @font-face {
    font-family: 'Minecraft';
    src: url('https://cdn.jsdelivr.net/gh/South-Paw/typeface-minecraft@master/files/minecraft-regular.woff2') format('woff2');
    font-weight: normal;
  }
  @font-face {
    font-family: 'Minecraft';
    src: url('https://cdn.jsdelivr.net/gh/South-Paw/typeface-minecraft@master/files/minecraft-bold.woff2') format('woff2');
    font-weight: bold;
  }

  html {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background-color: #000000;
    overflow-x: hidden;
  }

  body {
    margin: 0;
    padding: 40px 0 60px 0;
    min-height: 100vh;
    font-family: 'Minecraft', 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-sizing: border-box;
    background-color: #000000;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(255, 255, 255, 0.18) 0%, transparent 45%),
      radial-gradient(circle at 85% 20%, rgba(255, 255, 255, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 20% 80%, rgba(255, 255, 255, 0.14) 0%, transparent 45%),
      radial-gradient(circle at 90% 90%, rgba(255, 255, 255, 0.17) 0%, transparent 40%);
    background-repeat: no-repeat;
    background-size: 100% 100%;
  }

  .minecraft-title {
    font-size: 36px;
    font-weight: bold;
    color: #ffffff;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 3px 3px 0 #3f3f3f, 6px 6px 0 #1a1a1a;
    text-align: center;
    margin: 40px 0 20px 0;
  }

  .coin-counter {
    display: flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(180deg, #d9d9d9 0%, #b0b0b0 100%);
    border: 3px solid #8a8a8a;
    border-radius: 15px;
    padding: 6px 16px 6px 6px;
    box-shadow: 3px 3px 0 #3f3f3f, 6px 6px 0 #1a1a1a;
    margin-bottom: 50px;
  }

  .coin-icon {
    width: 40px;
    height: 40px;
    object-fit: contain;
    image-rendering: pixelated;
  }

  .coin-amount {
    font-size: 22px;
    font-weight: bold;
    color: #ffffff;
    text-shadow: 2px 2px 0 #3f3f3f;
    user-select: none;
  }

  .cases {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
    width: 100%;
    padding: 0 20px;
    box-sizing: border-box;
  }

  .case-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 320px;
  }

  .case-label {
    font-size: 18px;
    font-weight: bold;
    color: #ffffff;
    margin-bottom: 10px;
    text-shadow: 2px 2px 0 #3f3f3f;
    text-align: center;
  }

  .case-box {
    width: 100%;
    height: 140px;
    border-radius: 20px;
    background: linear-gradient(180deg, #d9d9d9 0%, #b0b0b0 100%);
    border: 3px solid #8a8a8a;
    box-shadow: 4px 4px 0 #3f3f3f, 8px 8px 0 #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    cursor: pointer;
  }

  .case-image {
    height: 90%;
    object-fit: contain;
    image-rendering: pixelated;
    mix-blend-mode: multiply;
    pointer-events: none;
  }

  .case-price {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    background: linear-gradient(180deg, #d9d9d9 0%, #b0b0b0 100%);
    border: 2px solid #8a8a8a;
    border-radius: 12px;
    padding: 4px 12px 4px 4px;
    box-shadow: 2px 2px 0 #3f3f3f, 4px 4px 0 #1a1a1a;
  }

  .price-coin {
    width: 26px;
    height: 26px;
    object-fit: contain;
    image-rendering: pixelated;
  }

  .price-amount {
    font-size: 16px;
    font-weight: bold;
    color: #ffffff;
    text-shadow: 2px 2px 0 #3f3f3f;
    user-select: none;
  }

  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
    min-height: 100vh;
    box-sizing: border-box;
  }

  .screen.active {
    display: flex;
  }

  #earth-screen, #gold-screen, #profile-screen, #inventory-screen {
    padding: 40px 20px;
  }

  .roulette-wrapper {
    position: relative;
    width: 100%;
    max-width: 360px;
    margin-top: 30px;
    margin-bottom: 10px;
  }

  .roulette-window {
    position: relative;
    width: 100%;
    height: 140px;
    overflow: hidden;
    border-radius: 20px;
    background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
    border: 3px solid #8a8a8a;
    box-shadow: 4px 4px 0 #3f3f3f, 8px 8px 0 #1a1a1a;
  }

  .roulette-strip {
    display: flex;
    align-items: center;
    height: 100%;
    position: absolute;
    left: 0;
    will-change: transform;
  }

  .roulette-item {
    flex: 0 0 auto;
    width: 120px;
    height: 120px;
    margin: 0 5px;
    border-radius: 12px;
    background-image: url('https://raw.githubusercontent.com/d7md6pm7tw-star/minedrop/main/IMG_9658.jpg');
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-position: center;
    image-rendering: pixelated;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .roulette-item img {
    width: 55%;
    height: 55%;
    object-fit: contain;
    image-rendering: pixelated;
  }

  .roulette-pointer {
    position: absolute;
    top: -10px;
    bottom: -10px;
    left: 50%;
    width: 4px;
    background: #ff2020;
    transform: translateX(-50%);
    box-shadow: 0 0 10px #ff2020, 0 0 20px #ff2020;
    z-index: 10;
    pointer-events: none;
    border-radius: 2px;
  }

  .roulette-pointer::before,
  .roulette-pointer::after {
    content: '';
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
  }

  .roulette-pointer::before {
    top: -12px;
    border-top: 12px solid #ff2020;
  }

  .roulette-pointer::after {
    bottom: -12px;
    border-bottom: 12px solid #ff2020;
  }

  .open-button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    max-width: 320px;
    padding: 18px 20px;
    background: linear-gradient(180deg, #d9d9d9 0%, #b0b0b0 100%);
    border: 3px solid #8a8a8a;
    border-radius: 20px;
    box-shadow: 4px 4px 0 #3f3f3f, 8px 8px 0 #1a1a1a;
    cursor: pointer;
    box-sizing: border-box;
    margin-top: 20px;
  }

  .open-button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .open-button-text {
    font-size: 20px;
    font-weight: bold;
    color: #ffffff;
    text-shadow: 2px 2px 0 #3f3f3f;
    user-select: none;
  }

  .open-button-coin {
    width: 32px;
    height: 32px;
    object-fit: contain;
    image-rendering: pixelated;
  }

  .back-button {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 20px;
    background: linear-gradient(180deg, #d9d9d9 0%, #b0b0b0 100%);
    border: 3px solid #8a8a8a;
    border-radius: 12px;
    box-shadow: 3px 3px 0 #3f3f3f, 6px 6px 0 #1a1a1a;
    cursor: pointer;
    margin-top: 30px;
    font-family: 'Minecraft', monospace;
    font-size: 16px;
    font-weight: bold;
    color: #ffffff;
    text-shadow: 2px 2px 0 #3f3f3f;
  }

  .result-label {
    font-size: 18px;
    font-weight: bold;
    color: #ffffff;
    text-shadow: 2px 2px 0 #3f3f3f;
    margin-top: 10px;
    text-align: center;
    min-height: 24px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .result-label.show {
    opacity: 1;
  }

  .rewards-title, .inventory-title, .profile-title {
    font-size: 16px;
    font-weight: bold;
    color: #ffffff;
    text-shadow: 2px 2px 0 #3f3f3f;
    text-align: center;
    margin-top: 25px;
    margin-bottom: 12px;
    opacity: 0.8;
  }

  .rewards-list, .inventory-items, .profile-items {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    max-width: 320px;
    min-height: 60px;
  }

  .reward-item {
    width: 70px;
    height: 70px;
    border-radius: 10px;
    background-image: url('https://raw.githubusercontent.com/d7md6pm7tw-star/minedrop/main/IMG_9658.jpg');
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-position: center;
    image-rendering: pixelated;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .reward-item img {
    width: 55%;
    height: 55%;
    object-fit: contain;
    image-rendering: pixelated;
  }

  .profile-empty {
    font-size: 14px;
    color: #888;
    text-shadow: 1px 1px 0 #000;
    text-align: center;
    padding: 40px 0;
  }

  .side-menu {
    position: fixed;
    top: 0;
    left: 0;
    width: 240px;
    height: 100%;
    background: #1a1a1a;
    border-right: 3px solid #8a8a8a;
    box-shadow: 6px 0 0 #3f3f3f;
    padding-top: 100px;
    box-sizing: border-box;
    transform: translateX(-100%);
    transition: transform 0.3s ease;
    z-index: 900;
    overflow-y: auto;
  }

  .side-menu.open {
    transform: translateX(0);
  }

  .menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    margin: 0 16px 12px 16px;
    background: linear-gradient(180deg, #d9d9d9 0%, #b0b0b0 100%);
    border: 3px solid #8a8a8a;
    border-radius: 12px;
    box-shadow: 3px 3px 0 #3f3f3f, 6px 6px 0 #1a1a1a;
    font-family: 'Minecraft', monospace;
    font-size: 18px;
    font-weight: bold;
    color: #ffffff;
    text-shadow: 2px 2px 0 #3f3f3f;
    cursor: pointer;
    user-select: none;
  }

  .menu-item-icon {
    width: 28px;
    height: 28px;
    object-fit: contain;
    image-rendering: pixelated;
    flex-shrink: 0;
  }

  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 800;
  }

  .overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .promo-screen {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }

  .promo-screen.open {
    display: flex;
  }

  .promo-box {
    width: 280px;
    max-width: 90%;
    background: #1a1a1a;
    border: 3px solid #8a8a8a;
    border-radius: 20px;
    box-shadow: 6px 6px 0 #3f3f3f;
    padding: 30px 20px 25px 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  .promo-title {
    font-size: 24px;
    font-weight: bold;
    color: #ffffff;
    text-shadow: 3px 3px 0 #3f3f3f;
    text-align: center;
    margin: 0;
  }

  .promo-input {
    width: 100%;
    padding: 12px 16px;
    font-family: 'Minecraft', monospace;
    font-size: 16px;
    font-weight: bold;
    color: #ffffff;
    background: #2a2a2a;
    border: 3px solid #8a8a8a;
    border-radius: 12px;
    box-shadow: inset 2px 2px 0 #0a0a0a;
    box-sizing: border-box;
    outline: none;
    text-align: center;
  }

  .promo-input::placeholder {
    color: #666;
    font-size: 14px;
  }

  .promo-button {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 40px;
    background: linear-gradient(180deg, #d9d9d9 0%, #b0b0b0 100%);
    border: 3px solid #8a8a8a;
    border-radius: 15px;
    box-shadow: 3px 3px 0 #3f3f3f, 6px 6px 0 #1a1a1a;
    cursor: pointer;
    font-family: 'Minecraft', monospace;
    font-size: 18px;
    font-weight: bold;
    color: #ffffff;
    text-shadow: 2px 2px 0 #3f3f3f;
    user-select: none;
  }

  .promo-result {
    font-size: 14px;
    font-weight: bold;
    text-align: center;
    min-height: 20px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .promo-result.show { opacity: 1; }
  .promo-result.error { color: #ff4040; text-shadow: 2px 2px 0 #3f0000; }
  .promo-result.success { color: #40ff40; text-shadow: 2px 2px 0 #003f00; }

  .promo-close {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 40px;
    height: 40px;
    background: linear-gradient(180deg, #d9d9d9 0%, #b0b0b0 100%);
    border: 3px solid #8a8a8a;
    border-radius: 10px;
    box-shadow: 3px 3px 0 #3f3f3f, 6px 6px 0 #1a1a1a;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 22px;
    font-weight: bold;
    color: #ffffff;
    text-shadow: 2px 2px 0 #3f3f3f;
    user-select: none;
    z-index: 1001;
  }
</style>
</head>
<body><div class="overlay" id="overlay" onclick="toggleMenu()"></div>

  <div class="side-menu" id="side-menu">
    <div class="menu-item" onclick="openCases()">
      <img src="https://raw.githubusercontent.com/d7md6pm7tw-star/minedrop/main/4BF1CCC4-6FCC-410B-A0BE-1BBBA1BA2595.PNG" alt="Кейсы" class="menu-item-icon">
      Кейсы
    </div>
    <div class="menu-item" onclick="openInventory()">
      <img src="https://raw.githubusercontent.com/d7md6pm7tw-star/minedrop/main/IMG_9672.PNG" alt="Инвентарь" class="menu-item-icon">
      Инвентарь
    </div>
    <div class="menu-item" onclick="openProfile()">
      <img src="https://raw.githubusercontent.com/d7md6pm7tw-star/minedrop/main/IMG_9675.JPG" alt="Профиль" class="menu-item-icon">
      Профиль
    </div>
    <div class="menu-item" onclick="openPromo()">
      <img src="https://raw.githubusercontent.com/d7md6pm7tw-star/minedrop/main/IMG_9678.WEBP" alt="Промокоды" class="menu-item-icon">
      Промокоды
    </div>
  </div>

  <div onclick="toggleMenu()" style="position:fixed;top:20px;left:20px;z-index:999;cursor:pointer;">
    <div style="width:44px;height:44px;background:linear-gradient(180deg,#d9d9d9 0%,#b0b0b0 100%);border:3px solid #8a8a8a;border-radius:10px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;box-shadow:3px 3px 0 #3f3f3f,6px 6px 0 #1a1a1a;">
      <div style="width:24px;height:3px;background:#fff;border-radius:2px;"></div>
      <div style="width:24px;height:3px;background:#fff;border-radius:2px;"></div>
      <div style="width:24px;height:3px;background:#fff;border-radius:2px;"></div>
    </div>
  </div>

  <div class="promo-screen" id="promo-screen">
    <div class="promo-close" onclick="closePromo()">✕</div>
    <div class="promo-box">
      <h2 class="promo-title">Промокоды</h2>
      <input type="text" class="promo-input" id="promo-input" placeholder="Введите промокод" autocomplete="off">
      <div class="promo-result" id="promo-result"></div>
      <div class="promo-button" onclick="applyPromo()">Применить</div>
    </div>
  </div>

  <div id="main-screen" class="screen active">
    <h1 class="minecraft-title">Mine Drop</h1>
    <div class="coin-counter">
      <img src="https://raw.githubusercontent.com/d7md6pm7tw-star/minedrop/main/coins.PNG" alt="Монеты" class="coin-icon">
      <span class="coin-amount" id="coin-display">100</span>
    </div>
    <div class="cases">
      <div class="case-block">
        <div class="case-label">Земляной кейс</div>
        <div class="case-box" onclick="openEarthCase()">
          <img src="https://raw.githubusercontent.com/d7md6pm7tw-star/minedrop/main/earth_case.jpeg" alt="Земляной кейс" class="case-image">
        </div>
        <div class="case-price">
          <img src="https://raw.githubusercontent.com/d7md6pm7tw-star/minedrop/main/coins.PNG" alt="Монеты" class="price-coin">
          <span class="price-amount">300</span>
        </div>
      </div>
      <div class="case-block">
        <div class="case-label">Золотой кейс</div>
        <div class="case-box" onclick="openGoldCase()">
          <img src="https://raw.githubusercontent.com/d7md6pm7tw-star/minedrop/main/gold_case.jpeg" alt="Золотой кейс" class="case-image">
        </div>
        <div class="case-price">
          <img src="https://raw.githubusercontent.com/d7md6pm7tw-star/minedrop/main/coins.PNG" alt="Монеты" class="price-coin">
          <span class="price-amount">700</span>
        </div>
      </div>
    </div>
  </div>

  <div id="earth-screen" class="screen">
    <h1 class="minecraft-title">Земляной сундук</h1>
    <div class="roulette-wrapper">
      <div class="roulette-window">
        <div class="roulette-strip" id="earth-strip"></div>
        <div class="roulette-pointer"></div>
      </div>
    </div>
    <div class="result-label" id="earth-result"></div>
    <div class="open-button" id="earth-open-button" onclick="spinRoulette('earth')">
      <span class="open-button-text">Открыть за 300</span>
      <img src="https://raw.githubusercontent.com/d7md6pm7tw-star/minedrop/main/coins.PNG" alt="Монеты" class="open-button-coin">
    </div>
    <div class="rewards-title">Возможные награды:</div>
    <div class="rewards-list" id="earth-rewards"></div>
    <button class="back-button" onclick="goBack('earth')">← Назад</button>
  </div>

  <div id="gold-screen" class="screen">
    <h1 class="minecraft-title">Золотой сундук</h1>
    <div class="roulette-wrapper">
      <div class="roulette-window">
        <div class="roulette-strip" id="gold-strip"></div>
        <div class="roulette-pointer"></div>
      </div>
    </div>
    <div class="result-label" id="gold-result"></div>
    <div class="open-button" id="gold-open-button" onclick="spinRoulette('gold')">
      <span class="open-button-text">Открыть за 700</span>
      <img src="https://raw.githubusercontent.com/d7md6pm7tw-star/minedrop/main/coins.PNG" alt="Монеты" class="open-button-coin">
    </div>
    <button class="back-button" onclick="goBack('gold')">← Назад</button>
  </div>

  <div id="inventory-screen" class="screen">
    <h1 class="minecraft-title">Инвентарь</h1>
    <div class="inventory-title">Мои предметы:</div>
    <div class="inventory-items" id="inventory-items"></div>
    <button class="back-button" onclick="goBack('inventory')">← Назад</button>
  </div>

  <div id="profile-screen" class="screen">
    <h1 class="minecraft-title">Профиль</h1>
    <div class="profile-title">Информация:</div>
    <div class="profile-items" id="profile-items"></div>
    <button class="back-button" onclick="goBack('profile')">← Назад</button>
  </div>

<script>
  const ITEM_WIDTH = 130;
  const ITEM_COUNT = 30;
  const SPIN_TIME = 4000;

  const AXE_IMG = "https://raw.githubusercontent.com/d7md6pm7tw-star/minedrop/main/IMG_9692.WEBP";
  const AXE_NAME = "Топор";

  const CAKE_IMG = "https://raw.githubusercontent.com/d7md6pm7tw-star/minedrop/main/IMG_9696.WEBP";
  const CAKE_NAME = "Торт";

  const EARTH_ITEMS = [
    { img: AXE_IMG, name: AXE_NAME },
    { img: CAKE_IMG, name: CAKE_NAME }
  ];

  const GOLD_ITEMS = [];

  const EARTH_PRICE = 300;
  const GOLD_PRICE = 700;

  const PROMOCODES = {
    'wipe': { coins: 700 },
    '1k': { coins: 1000 }
  };

  let isSpinning = false;

  let coins = parseInt(localStorage.getItem('minedrop_coins'));
  if (isNaN(coins)) {
    coins = 100;
    localStorage.setItem('minedrop_coins', coins);
  }

  let usedPromos = JSON.parse(localStorage.getItem('minedrop_used_promos') || '[]');
  let inventory = JSON.parse(localStorage.getItem('minedrop_inventory') || '[]');

  function updateCoinDisplay() {
    document.getElementById('coin-display').textContent = coins;
  }

  function saveCoins() {
    localStorage.setItem('minedrop_coins', coins);
  }

  function saveInventory() {
    localStorage.setItem('minedrop_inventory', JSON.stringify(inventory));
  }

  function toggleMenu() {
    document.getElementById('side-menu').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('open');
  }

  function openCases() {
    document.getElementById('side-menu').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('main-screen').classList.add('active');
    document.getElementById('earth-screen').classList.remove('active');
    document.getElementById('gold-screen').classList.remove('active');
    document.getElementById('inventory-screen').classList.remove('active');
    document.getElementById('profile-screen').classList.remove('active');
    window.scrollTo(0, 0);
  }

  function openPromo() {
    document.getElementById('side-menu').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('promo-screen').classList.add('open');
    document.getElementById('promo-input').value = '';
    document.getElementById('promo-result').classList.remove('show', 'error', 'success');
    document.getElementById('promo-result').textContent = '';
  }

  function closePromo() {
    document.getElementById('promo-screen').classList.remove('open');
  }

  function applyPromo() {
    const input = document.getElementById('promo-input');
    const result = document.getElementById('promo-result');
    const code = input.value.trim().toLowerCase();

    result.classList.remove('show', 'error', 'success');
    result.textContent = '';

    if (!code) {
      result.textContent = 'Введите промокод';
      result.classList.add('show', 'error');
      return;
    }

    if (usedPromos.includes(code)) {
      result.textContent = 'Промокод уже использован';
      result.classList.add('show', 'error');
      return;
    }

    if (PROMOCODES[code]) {
      coins += PROMOCODES[code].coins;
      saveCoins();
      updateCoinDisplay();
      usedPromos.push(code);
      localStorage.setItem('minedrop_used_promos', JSON.stringify(usedPromos));
      result.textContent = 'Награда получена! +' + PROMOCODES[code].coins + ' монет';
      result.classList.add('show', 'success');
      input.value = '';
    } else {
      result.textContent = 'Неправильный промокод';
      result.classList.add('show', 'error');
    }
  }

  function buildStrip(screenName) {
    const items = screenName === 'earth' ? EARTH_ITEMS : GOLD_ITEMS;
    const strip = document.getElementById(screenName + '-strip');
    strip.innerHTML = '';
    for (let i = 0; i < ITEM_COUNT; i++) {
      const item = document.createElement('div');
      item.className = 'roulette-item';
      if (items.length > 0) {
        const randomItem = items[Math.floor(Math.random() * items.length)];
        const img = document.createElement('img');
        img.src = randomItem.img;
        img.alt = randomItem.name;
        item.appendChild(img);
      }
      strip.appendChild(item);
    }
  }

  function buildRewards() {
    const list = document.getElementById('earth-rewards');
    list.innerHTML = '';
    if (EARTH_ITEMS.length === 0) {
      list.innerHTML = '<div class="profile-empty">Пока нет наград</div>';
      return;
    }
    EARTH_ITEMS.forEach(item => {
      const div = document.createElement('div');
      div.className = 'reward-item';
      const img = document.createElement('img');
      img.src = item.img;
      img.alt = item.name;
      div.appendChild(img);
      list.appendChild(div);
    });
  }

  function openEarthCase() {
    document.getElementById('main-screen').classList.remove('active');
    document.getElementById('earth-screen').classList.add('active');
    window.scrollTo(0, 0);
    buildStrip('earth');
    buildRewards();
  }

  function openGoldCase() {
    document.getElementById('main-screen').classList.remove('active');
    document.getElementById('gold-screen').classList.add('active');
    window.scrollTo(0, 0);
    buildStrip('gold');
  }

  function openInventory() {
    document.getElementById('side-menu').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('main-screen').classList.remove('active');
    document.getElementById('earth-screen').classList.remove('active');
    document.getElementById('gold-screen').classList.remove('active');
    document.getElementById('profile-screen').classList.remove('active');
    document.getElementById('inventory-screen').classList.add('active');
    window.scrollTo(0, 0);
    buildInventory();
  }

  function buildInventory() {
    const container = document.getElementById('inventory-items');
    container.innerHTML = '';
    if (inventory.length === 0) {
      container.innerHTML = '<div class="profile-empty">Инвентарь пуст<br>Открой кейс, чтобы получить предметы</div>';
      return;
    }
    inventory.forEach(item => {
      const div = document.createElement('div');
      div.className = 'reward-item';
      const img = document.createElement('img');
      img.src = item.img;
      img.alt = item.name;
      div.appendChild(img);
      container.appendChild(div);
    });
  }

  function openProfile() {
    document.getElementById('side-menu').classList.remove('open');
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('main-screen').classList.remove('active');
    document.getElementById('earth-screen').classList.remove('active');
    document.getElementById('gold-screen').classList.remove('active');
    document.getElementById('inventory-screen').classList.remove('active');
    document.getElementById('profile-screen').classList.add('active');
    window.scrollTo(0, 0);
    buildProfile();
  }

  function buildProfile() {
    const container = document.getElementById('profile-items');
    container.innerHTML = '<div class="profile-empty">Монет: ' + coins + '<br>Предметов в инвентаре: ' + inventory.length + '</div>';
  }

  function goBack(screenName) {
    document.getElementById(screenName + '-screen').classList.remove('active');
    document.getElementById('main-screen').classList.add('active');
    window.scrollTo(0, 0);
  }

  function spinRoulette(screenName) {
    if (isSpinning) return;

    const price = screenName === 'earth' ? EARTH_PRICE : GOLD_PRICE;
    const resultLabel = document.getElementById(screenName + '-result');

    if (coins < price) {
      resultLabel.classList.remove('show');
      resultLabel.textContent = '';
      resultLabel.classList.add('show');
      resultLabel.style.color = '#ff4040';
      resultLabel.textContent = 'Недостаточно средств';
      setTimeout(() => {
        resultLabel.classList.remove('show');
        resultLabel.style.color = '';
      }, 2000);
      return;
    }

    coins -= price;
    saveCoins();
    updateCoinDisplay();

    isSpinning = true;

    const items = screenName === 'earth' ? EARTH_ITEMS : GOLD_ITEMS;
    const strip = document.getElementById(screenName + '-strip');
    const openButton = document.getElementById(screenName + '-open-button');

    openButton.disabled = true;
    resultLabel.classList.remove('show');
    resultLabel.textContent = '';
    resultLabel.style.color = '';

    strip.style.transition = 'none';
    strip.style.transform = 'translateX(0)';

    setTimeout(() => {
      const winIndex = Math.floor(Math.random() * (ITEM_COUNT - 10)) + 5;
      const windowWidth = strip.parentElement.offsetWidth;
      const centerOffset = windowWidth / 2;
      const itemCenter = winIndex * ITEM_WIDTH + ITEM_WIDTH / 2;
      const finalTranslate = centerOffset - itemCenter;

      strip.style.transition = 'transform ' + SPIN_TIME + 'ms cubic-bezier(0.15, 0.85, 0.35, 1)';
      strip.style.transform = 'translateX(' + finalTranslate + 'px)';

      setTimeout(() => {
        let winItem;
        if (items.length > 0) {
          winItem = items[Math.floor(Math.random() * items.length)];
        } else {
          winItem = { img: '', name: 'Рамка' };
        }

        resultLabel.textContent = '🎁 ' + winItem.name + '!';
        resultLabel.classList.add('show');

        if (winItem.img) {
          inventory.push({ img: winItem.img, name: winItem.name });
          saveInventory();
        }

        isSpinning = false;
        openButton.disabled = false;
      }, SPIN_TIME + 100);
    }, 50);
  }

  updateCoinDisplay();
</script>

</body>
</html>
